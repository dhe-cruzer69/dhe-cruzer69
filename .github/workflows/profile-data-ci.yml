name: Profile Data CI
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - "feat/profile-activity-metrics"
    paths:
      - "scripts/update_profile_data.py"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/fetch_profile_metrics.sh scripts/verify_profile_deployment.sh
